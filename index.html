<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardSync AI - Escáner e Inteligencia de Contactos</title>
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%22CardSync%20AI%22,
    %22short_name%22:%22CardSync%22,
    %22start_url%22:%22/%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22%230f172a%22,
    %22theme_color%22:%22%232563eb%22,
    %22icons%22:[{%22src%22:%22https://via.placeholder.com/192/2563eb/ffffff?text=CS%22,%22sizes%22:%22192x192%22,%22type%22:%22image/png%22}]
  }">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Tesseract.js (Respaldo OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans pb-12">

  <!-- Header / Barra Superior -->
  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-[#2563eb] fa-address-card text-blue-500 text-2xl"></i>
      <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">CardSync AI</span>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="openShareModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-sm font-medium flex items-center gap-2 transition">
        <i class="fa-solid fa-share-nodes text-blue-400"></i>
        <span>Compartir App</span>
      </button>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-6">

    <!-- Sección Capturar Tarjeta -->
    <section class="glass-card rounded-2xl p-5 shadow-xl space-y-4">
      <h2 class="text-md font-semibold text-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-camera text-blue-400"></i> Escanear Tarjeta de Presentación
      </h2>

      <!-- Área de carga / vista previa -->
      <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-xl p-6 text-center cursor-pointer transition bg-slate-800/40 relative overflow-hidden group">
        <input type="file" id="cardInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelect(event)">
        
        <div id="uploadPlaceholder" class="space-y-3">
          <div class="w-12 h-12 rounded-full bg-blue-500/10 text-blue-400 flex items-center justify-center mx-auto text-xl">
            <i class="fa-solid fa-cloud-arrow-up"></i>
          </div>
          <div>
            <p class="font-medium text-slate-200">Haz clic o arrastra la foto de la tarjeta</p>
            <p class="text-xs text-slate-400 mt-1">Usa la cámara o sube un archivo desde la galería</p>
          </div>
        </div>

        <img id="imagePreview" class="hidden max-h-56 mx-auto rounded-lg object-contain shadow-md" alt="Vista previa de tarjeta">
      </div>

      <div id="statusMessage" class="hidden p-3 rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-300 text-xs flex items-center gap-2">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <span id="statusText">Procesando imagen con IA...</span>
      </div>
    </section>

    <!-- Sección Formulario de Contacto -->
    <section class="glass-card rounded-2xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h2 class="text-md font-semibold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-user-pen text-blue-400"></i> Información del Contacto
        </h2>
        <span class="text-xs font-mono bg-blue-500/20 text-blue-300 border border-blue-500/30 px-2 py-0.5 rounded">vCard 3.0</span>
      </div>

      <form id="contactForm" class="space-y-3 text-sm" onsubmit="event.preventDefault(); updateQR();">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Nombre(s) *</label>
            <input type="text" id="firstName" required class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Apellido(s) *</label>
            <input type="text" id="lastName" required class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Empresa / Organización</label>
          <input type="text" id="organization" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Cargo / Puesto</label>
          <input type="text" id="jobTitle" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Teléfonos -->
        <div class="p-3 bg-slate-800/40 rounded-xl border border-slate-800 space-y-3">
          <p class="text-xs font-semibold text-blue-400 uppercase tracking-wider">Números Telefónicos</p>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Cód. País</label>
            <input type="text" id="countryCode" value="+506" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div class="col-span-2">
              <label class="block text-xs text-slate-400 mb-1">Teléfono Fijo / Trabajo</label>
              <input type="text" id="workPhone" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Ext.</label>
              <input type="text" id="extension" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Móvil / Celular</label>
            <input type="text" id="mobilePhone" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Correo Electrónico</label>
          <input type="email" id="email" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Sitio Web</label>
          <input type="url" id="website" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Dirección Física</label>
          <textarea id="address" rows
