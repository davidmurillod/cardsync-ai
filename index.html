<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardSync AI</title>
  <!-- Tailwind CSS para el diseño -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-xl mx-auto space-y-6">
    <!-- Encabezado -->
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
      <h1 class="text-lg font-bold flex items-center gap-2">
        📸 Escanear con Gemini AI
      </h1>
      <button onclick="resetForm()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">
        + Crear Nuevo
      </button>
    </div>

    <!-- Área de Carga de Imagen -->
    <div class="border-2 border-dashed border-slate-700 rounded-xl p-6 text-center bg-slate-800/50 relative">
      <input type="file" id="cardInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="handleImageUpload(event)">
      <div id="previewContainer" class="space-y-3">
        <div class="text-slate-400">
          <p class="text-sm">Sube la foto de la tarjeta de presentación aquí</p>
          <p class="text-xs text-slate-500 mt-1">Haz clic o arrastra una imagen</p>
        </div>
      </div>
    </div>

    <!-- Indicador de Carga -->
    <div id="loadingIndicator" class="hidden bg-slate-800 border border-slate-700 p-4 rounded-xl flex items-center justify-center gap-3 text-blue-400">
      <svg class="animate-spin h-5 w-5 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="text-sm font-medium">Gemini AI analizando la tarjeta con alta velocidad...</span>
    </div>

    <!-- Formulario de Contacto -->
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h2 class="font-semibold text-slate-200">Información del Contacto</h2>
        <span class="text-xs bg-slate-700 px-2.5 py-1 rounded text-slate-300 font-mono">vCard 3.0</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nombre(s) *</label>
          <input type="text" id="firstName" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Apellido(s) *</label>
          <input type="text" id="lastName" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Empresa / Organización</label>
        <input type="text" id="organization" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Cargo / Puesto</label>
        <input type="text" id="jobTitle" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div class="border-t border-slate-700/60 pt-3">
        <span class="text-xs font-bold text-blue-400 uppercase tracking-wider">Números Telefónicos</span>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Cód. País</label>
          <input type="text" id="countryCode" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" value="+506">
        </div>
        <div class="col-span-2">
          <label class="block text-xs text-slate-400 mb-1">Teléfono Fijo / Trabajo</label>
          <input type="text" id="workPhone" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Ext.</label>
          <input type="text" id="extension" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Celular / Móvil</label>
          <input type="text" id="mobilePhone" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Correo Electrónico</label>
        <input type="email" id="email" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Sitio Web</label>
        <input type="text" id="website" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Dirección Física</label>
        <textarea id="address" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
      </div>
    </div>
  </div>

  <script>
    // Función para comprimir la imagen antes de enviarla y evitar saturar la red
    function compressImage(file, maxWidth = 800, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64String = dataUrl.split(',')[1];
            
            resolve({
              base64Image: base64String,
              mimeType: 'image/jpeg',
              dataUrl: dataUrl
            });
          };
          img.onerror = (error) => reject(error);
        };
        reader.onerror = (error) => reject(error);
      });
    }

    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const loadingIndicator = document.getElementById('loadingIndicator');
      const previewContainer = document.getElementById('previewContainer');

      loadingIndicator.classList.remove('hidden');

      try {
        // 1. Comprimir imagen al instante
        const { base64Image, mimeType, dataUrl } = await compressImage(file, 800, 0.8);

        // Mostrar vista previa de la imagen comprimida
        previewContainer.innerHTML = `
          <div class="flex justify-center">
            <img src="${dataUrl}" class="max-h-48 rounded-lg shadow-md border border-slate-700 object-contain">
          </div>
        `;

        // 2. Enviar a la función serverless de Vercel
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ base64Image, mimeType })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Error en el servidor');
        }

        // 3. Extraer y limpiar texto de la respuesta de Gemini
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleanJsonText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsedData = JSON.parse(cleanJsonText);

        // 4. Rellenar los campos del formulario automáticamente
        document.getElementById('firstName').value = parsedData.firstName || '';
        document.getElementById('lastName').value = parsedData.lastName || '';
        document.getElementById('organization').value = parsedData.organization || '';
        document.getElementById('jobTitle').value = parsedData.jobTitle || '';
        if (parsedData.countryCode) {
          document.getElementById('countryCode').value = parsedData.countryCode;
        }
        document.getElementById('workPhone').value = parsedData.workPhone || '';
        document.getElementById('extension').value = parsedData.extension || '';
        document.getElementById('mobilePhone').value = parsedData.mobilePhone || '';
        document.getElementById('email').value = parsedData.email || '';
        document.getElementById('website').value = parsedData.website || '';
        document.getElementById('address').value = parsedData.address || '';

      } catch (err) {
        console.error("Error al procesar la tarjeta:", err);
        alert("Hubo un error procesando la tarjeta. Por favor intenta de nuevo.");
      } finally {
        loadingIndicator.classList.add('hidden');
      }
    }

    function resetForm() {
      document.getElementById('cardInput').value = '';
      document.getElementById('previewContainer').innerHTML = `
        <div class="text-slate-400">
          <p class="text-sm">Sube la foto de la tarjeta de presentación aquí</p>
          <p class="text-xs text-slate-500 mt-1">Haz clic o arrastra una imagen</p>
        </div>
      `;
      // Limpiar inputs
      const inputs = document.querySelectorAll('input:not(#countryCode), textarea');
      inputs.forEach(input => input.value = '');
    }
  </script>
</body>
</html>
